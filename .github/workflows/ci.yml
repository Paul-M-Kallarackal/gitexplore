name: Verify

on:
  pull_request:

concurrency:
  group: verify-${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: Detect production image changes
    runs-on: ubuntu-latest
    outputs:
      production_api: ${{ steps.filter.outputs.production_api }}
      source_build: ${{ steps.filter.outputs.source_build }}
    steps:
      - uses: actions/checkout@v4

      - name: Detect production API image inputs
        id: filter
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git fetch --no-tags --depth=1 origin "$BASE_SHA"
          if git diff --quiet "$BASE_SHA" HEAD -- \
            .github/scripts/prepare-linux-release.sh \
            .github/workflows/ci.yml \
            .github/workflows/release.yml \
            .dockerignore \
            .gitexplore-release \
            Dockerfile.vercel \
            Cargo.toml \
            Cargo.lock \
            rust-toolchain.toml \
            src \
            docker/neo4j/init; then
            echo "production_api=false" >> "$GITHUB_OUTPUT"
          else
            echo "production_api=true" >> "$GITHUB_OUTPUT"
          fi

          if git diff --quiet "$BASE_SHA" HEAD -- \
            .dockerignore \
            .gitexplore-release \
            Dockerfile.vercel \
            Cargo.toml \
            Cargo.lock \
            rust-toolchain.toml; then
            echo "source_build=false" >> "$GITHUB_OUTPUT"
          else
            echo "source_build=true" >> "$GITHUB_OUTPUT"
          fi

  quality:
    name: Core Rust and browser checks
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Restore Rust toolchain and dependency cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.rustup/toolchains/1.91.0-x86_64-unknown-linux-gnu
            ~/.rustup/update-hashes/1.91.0-x86_64-unknown-linux-gnu
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ubuntu-22.04-${{ runner.arch }}-rust-1.91.0-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}

      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.91.0 --profile minimal --component rustfmt,clippy

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify Rust service
        run: |
          cargo fmt --check
          cargo clippy --all-targets --locked -- -D warnings
          cargo test --locked

      - name: Verify browser packages
        run: |
          pnpm --filter @gitexplore/api-client test
          pnpm --filter @gitexplore/web test
          pnpm check

      - name: Verify production contract and web build
        run: |
          pnpm production:check
          pnpm --filter @gitexplore/web build

  production_image:
    name: Production API image
    needs: changes
    if: needs.changes.outputs.production_api == 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v4

      - name: Restore pinned Linux Rust cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.rustup/toolchains/1.91.0-x86_64-unknown-linux-gnu
            ~/.rustup/update-hashes/1.91.0-x86_64-unknown-linux-gnu
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ubuntu-22.04-${{ runner.arch }}-rust-1.91.0-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}

      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.91.0 --profile minimal --component rustfmt,clippy

      - name: Build verified Linux release binary
        run: bash .github/scripts/prepare-linux-release.sh

      - name: Verify production API image
        run: docker build --file Dockerfile.vercel --tag gitexplore-api:verify .

      - name: Boot production API image
        run: docker run --rm gitexplore-api:verify gitexplore --help

      - name: Verify self-contained production image fallback
        if: needs.changes.outputs.source_build == 'true'
        run: |
          rm .gitexplore-release/gitexplore .gitexplore-release/source.sha256
          docker build --file Dockerfile.vercel --tag gitexplore-api:fallback .
          docker run --rm gitexplore-api:fallback gitexplore --help

  verify:
    name: Rust and browser checks
    if: always()
    needs: [changes, quality, production_image]
    runs-on: ubuntu-latest
    steps:
      - name: Require every applicable gate
        shell: bash
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          PRODUCTION_API: ${{ needs.changes.outputs.production_api }}
          QUALITY_RESULT: ${{ needs.quality.result }}
          IMAGE_RESULT: ${{ needs.production_image.result }}
        run: |
          test "$CHANGES_RESULT" = "success"
          test "$QUALITY_RESULT" = "success"
          if [ "$PRODUCTION_API" = "true" ]; then
            test "$IMAGE_RESULT" = "success"
          else
            test "$PRODUCTION_API" = "false"
            test "$IMAGE_RESULT" = "skipped"
          fi
