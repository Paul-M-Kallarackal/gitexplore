name: Verify

on:
  pull_request:

concurrency:
  group: verify-${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Rust and browser checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Restore Rust toolchain and dependency cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.rustup/toolchains/1.91.0-x86_64-unknown-linux-gnu
            ~/.rustup/update-hashes/1.91.0-x86_64-unknown-linux-gnu
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ runner.arch }}-rust-1.91.0-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}

      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.91.0 --profile minimal --component rustfmt,clippy

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify Rust service
        run: |
          cargo fmt --check
          cargo clippy --all-targets --locked -- -D warnings
          cargo test --locked

      - name: Verify browser packages
        run: |
          pnpm --filter @gitexplore/api-client test
          pnpm --filter @gitexplore/web check
          pnpm --filter @gitexplore/web test
          pnpm check

      - name: Verify production contract and web build
        run: |
          pnpm production:check
          pnpm --filter @gitexplore/web build

      - uses: docker/setup-buildx-action@v3

      - name: Verify production API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.vercel
          push: false
          tags: gitexplore-api:verify
          cache-from: type=gha,scope=gitexplore-api
          cache-to: type=gha,mode=max,scope=gitexplore-api
