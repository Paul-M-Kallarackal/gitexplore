name: gitexplore

services:
  neo4j:
    image: neo4j:5.26-community
    container_name: gitexplore-neo4j
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: "${NEO4J_USERNAME:-neo4j}/${NEO4J_PASSWORD:-gitexplore-dev-password}"
    volumes:
      - neo4j-data:/data
      - neo4j-logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -a bolt://localhost:7687 -u ${NEO4J_USERNAME:-neo4j} -p ${NEO4J_PASSWORD:-gitexplore-dev-password} 'RETURN 1'"]
      interval: 10s
      timeout: 10s
      retries: 20

  neo4j-init:
    image: gitexplore-app:local
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      neo4j:
        condition: service_healthy
    environment:
      GITEXPLORE_GRAPH_BACKEND: "neo4j"
      GITEXPLORE_IDENTITY_ENCRYPTION_KEY: "${GITEXPLORE_IDENTITY_ENCRYPTION_KEY:-HC7oBiY2DcgwFPFOplgK1nk77uOQV7x__mLWuIEBFz4}"
      GITEXPLORE_NEO4J_URI: "neo4j://neo4j:7687"
      GITEXPLORE_NEO4J_USERNAME: "${NEO4J_USERNAME:-neo4j}"
      GITEXPLORE_NEO4J_PASSWORD: "${NEO4J_PASSWORD:-gitexplore-dev-password}"
      GITEXPLORE_NEO4J_DATABASE: "${GITEXPLORE_NEO4J_DATABASE:-neo4j}"
    command: ["gitexplore", "schema", "apply"]
    restart: "no"

  gitexplore:
    image: gitexplore-app:local
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gitexplore-app
    depends_on:
      neo4j:
        condition: service_healthy
      neo4j-init:
        condition: service_completed_successfully
    ports:
      - "4000:4000"
    environment:
      GITEXPLORE_SERVER_ADDR: "0.0.0.0:4000"
      GITEXPLORE_GRAPH_BACKEND: "neo4j"
      GITEXPLORE_DATA_DIR: "/var/lib/gitexplore"
      GITEXPLORE_FRONTEND_ORIGIN: "${GITEXPLORE_FRONTEND_ORIGIN:-http://localhost:3000}"
      GITEXPLORE_GITHUB_CLIENT_ID: "${GITEXPLORE_GITHUB_CLIENT_ID}"
      GITEXPLORE_GITHUB_CLIENT_SECRET: "${GITEXPLORE_GITHUB_CLIENT_SECRET}"
      GITEXPLORE_GITHUB_REDIRECT_URI: "${GITEXPLORE_GITHUB_REDIRECT_URI:-http://localhost:4000/auth/oauth/callback}"
      GITEXPLORE_GITHUB_SCOPES: "${GITEXPLORE_GITHUB_SCOPES:-read:user}"
      # Public, development-only fallback. Production must inject an independent random key.
      GITEXPLORE_IDENTITY_ENCRYPTION_KEY: "${GITEXPLORE_IDENTITY_ENCRYPTION_KEY:-HC7oBiY2DcgwFPFOplgK1nk77uOQV7x__mLWuIEBFz4}"
      GITEXPLORE_NEO4J_URI: "neo4j://neo4j:7687"
      GITEXPLORE_NEO4J_USERNAME: "${NEO4J_USERNAME:-neo4j}"
      GITEXPLORE_NEO4J_PASSWORD: "${NEO4J_PASSWORD:-gitexplore-dev-password}"
      GITEXPLORE_NEO4J_DATABASE: "${GITEXPLORE_NEO4J_DATABASE:-neo4j}"
    volumes:
      - gitexplore-data:/var/lib/gitexplore

  web:
    image: node:24-bookworm
    container_name: gitexplore-web
    working_dir: /workspace
    depends_on:
      gitexplore:
        condition: service_started
    ports:
      - "3000:3000"
    environment:
      GITEXPLORE_DEV_API_BASE_URL: "http://gitexplore:4000"
    command:
      - /bin/sh
      - -lc
      - |
        corepack enable
        pnpm install --frozen-lockfile
        pnpm --filter @gitexplore/web dev --host 0.0.0.0 --port 3000
    volumes:
      - .:/workspace

volumes:
  neo4j-data:
  neo4j-logs:
  gitexplore-data:
