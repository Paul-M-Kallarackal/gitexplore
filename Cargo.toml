[package]
name = "gitexplore"
version = "0.1.0"
edition = "2024"

[dependencies]
async-trait = "0.1.89"
async-graphql = { version = "=7.2.1", default-features = false }
async-graphql-axum = "=7.2.1"
axum = "0.8.9"
base64 = "0.22.1"
chrono = { version = "0.4.45", features = ["serde"] }
chacha20poly1305 = "0.10.1"
clap = { version = "4.6.1", features = ["derive"] }
hmac = "0.12.1"
hkdf = "0.12.4"
neo4rs = "0.8.0"
octocrab = "0.53.1"
reqwest = { version = "0.13.4", default-features = false, features = ["json", "rustls"] }
rustls = { version = "0.23.41", features = ["aws_lc_rs"] }
secrecy = "0.10.3"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
sha2 = "0.10.9"
tempfile = "3.27.0"
thiserror = "2.0.18"
tokio = { version = "1.52.3", features = ["macros", "rt-multi-thread", "signal", "net", "time"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
tower-http = { version = "0.6.6", features = ["cors"] }
url = "2.5.8"
uuid = { version = "1.23.4", features = ["v4", "serde"] }

[dev-dependencies]
assert_cmd = "2.2.2"
predicates = "3.1.4"
tower = "0.5.3"
